<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/png" href="top-eventos.png">
  <link rel="preload" as="image" href="sello-cera.webp">
  <link rel="preload" as="image" href="papel-negro.webp">
  <meta name="description" content="Abre tu invitación al Cotillón 26/27 de TOP EVENTOS. Salón Benalucar, Sanlúcar la Mayor. Entrada para mayores de 18 años.">
  <title>Cotillón 26/27 · TOP EVENTOS</title>
  <style>
    :root{color-scheme:dark;--gold:#ddbe76;--cream:#f4ebd8;--size:min(79vw,400px)}
    *{box-sizing:border-box}
    html{min-height:100%;background:#080808}
    body{margin:0;color:var(--cream);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 58%,#2c231349,transparent 54%),linear-gradient(145deg,#101010,#070707 58%,#100e0a);min-height:100svh;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.2' d='M0 0h180v180H0z'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:2px solid #ffe3a0;outline-offset:8px}
    main{position:relative;max-width:900px;min-height:100svh;margin:auto;padding:48px 16px 36px;display:flex;flex-direction:column;align-items:center}
    header{text-align:center;z-index:2}
    .eyebrow{font-size:10px;letter-spacing:.28em;color:#bda77c;margin:0 0 17px}
    .spark{display:block;margin:0 auto 15px;width:15px;height:22px;background:linear-gradient(135deg,#ffedb8,#b78836);clip-path:polygon(50% 0,64% 35%,100% 50%,64% 65%,50% 100%,36% 65%,0 50%,36% 35%)}
    h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(40px,10vw,67px);font-weight:400;letter-spacing:.03em;margin:0;line-height:1.08;background:linear-gradient(110deg,#b89547,#f4d99a 43%,#d6ad61 70%,#faf0b9);-webkit-background-clip:text;background-clip:text;color:transparent}
    .year{font-family:Georgia,'Times New Roman',serif;letter-spacing:.2em;font-size:23px;margin:10px 0 0;color:#e0cb9a}
    .intro{font-size:13px;letter-spacing:.05em;color:#b5afa4;margin:19px 0 0}
    .scene{width:var(--size);aspect-ratio:1;position:relative;margin:99px 0 110px;perspective:1200px;isolation:isolate}
    .scene::after{content:"";position:absolute;left:9%;right:9%;bottom:-12%;height:18%;border-radius:50%;background:#000;filter:blur(24px);opacity:.85;z-index:-1;transition:transform 1.4s,opacity 1.4s}
    .envelope{position:absolute;inset:0;transition:transform 1.65s cubic-bezier(.3,.05,.15,1) .65s,opacity .8s 2s;transform-style:preserve-3d}
    .paper{position:absolute;inset:0;border:1px solid #30302d;border-radius:1.5px;background:linear-gradient(125deg,#ffffff0d,#00000050 55%,#00000024),url('papel-negro.webp') center/100% 100%;box-shadow:0 2px 2px #000c,3px 14px 23px #0009,8px 35px 50px #0007,inset .5px .5px 0 #b0afa72e,inset -1px -1px 0 #000a;z-index:1}
    .inner{position:absolute;inset:1%;background:linear-gradient(170deg,#000000c9,#00000073 67%,#00000029),url('papel-negro.webp') center/100% 100%;box-shadow:inset 0 18px 28px #0008;z-index:2}
    .fold{position:absolute;inset:0;pointer-events:none;z-index:4}
    .fold-left{clip-path:polygon(0 0,56% 55%,0 100%);background:linear-gradient(112deg,#ffffff06,#00000035 75%,#0000006b),url('papel-negro.webp') center/100% 100%}
    .fold-right{clip-path:polygon(100% 0,44% 55%,100% 100%);background:linear-gradient(245deg,#ffffff10,#0000001c 60%,#0000006b),url('papel-negro.webp') center/100% 100%}
    .fold-bottom{clip-path:polygon(0 100%,50% 47%,100% 100%);background:linear-gradient(175deg,#ffffff16 47%,#0000000d 56%,#00000050),url('papel-negro.webp') center/100% 100%;box-shadow:inset 0 -1px #5a59532e}
    .fold-lines{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none}
    .flap{position:absolute;left:0;right:0;top:0;height:55%;transform-origin:50% 0;transform:rotateX(0);backface-visibility:visible;z-index:7;filter:drop-shadow(0 2px 1px #000b) drop-shadow(0 4px 4px #0006);transition:transform 1.1s cubic-bezier(.4,0,.2,1) .22s}
    .flap::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(170deg,#ffffff14,#ffffff04 35%,#00000040 93%,#00000070),url('papel-negro.webp') center top/100% 182%;border-top:1px solid #7d7c6d44}
    .flap svg{width:100%;height:100%;position:absolute}
    .open-trigger{position:absolute;inset:0;z-index:10;cursor:pointer;border:0;background:transparent;transition:opacity .32s,visibility .32s;touch-action:manipulation}
    .seal{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%) rotate(-7deg);width:35%;aspect-ratio:1;filter:drop-shadow(.5px 1.2px 0 #68431b) drop-shadow(0 3px 2px #000b) drop-shadow(2px 7px 6px #0008);transition:transform .4s,filter .4s}
    .seal-image{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
    .gold-logo{position:absolute;inset:17%;background:linear-gradient(145deg,#f7dd91 4%,#946421 46%,#f2d084 49%,#b08134 78%);-webkit-mask:url('top-eventos.png') center/contain no-repeat;mask:url('top-eventos.png') center/contain no-repeat;filter:drop-shadow(1px 1px 0 #68461b) drop-shadow(-.6px -.7px 0 #fff1b9);transform:translateZ(0)}
    .open-trigger:hover .seal{transform:translate(-50%,-50%) rotate(-7deg) scale(1.035);filter:drop-shadow(.5px 1.2px 0 #68431b) drop-shadow(0 3px 2px #000b) drop-shadow(2px 7px 6px #0008) brightness(1.045)}
    .open-trigger:active .seal{transform:translate(-50%,-50%) rotate(-7deg) scale(.985)}
    .ticket{position:absolute;inset:0;z-index:3;container-type:inline-size;visibility:hidden;opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(9%) scale(.86);transition:transform 1.7s cubic-bezier(.2,.65,.15,1) 1.05s,clip-path 1.6s cubic-bezier(.2,.65,.15,1) 1.05s,opacity .25s 1.05s;box-shadow:0 28px 54px #0009;isolation:isolate}
    .ticket-face{position:absolute;inset:0;text-align:center;overflow:hidden;color:#76531e;background:repeating-linear-gradient(103deg,#fff3 0,#fff3 1px,#99999908 1px,#99999908 3px),linear-gradient(120deg,#a5a7a8,#e7e8e8 20%,#c3c6c7 34%,#f4f4f1 51%,#d0d2d3 69%,#a5a8aa 100%);padding:6% 7%;display:flex;flex-direction:column;align-items:center}
    .ticket-face::before{content:"";position:absolute;inset:3%;border:1px solid #a8823e;pointer-events:none;box-shadow:inset 0 0 0 2px #e9e2cf66}
    .ticket-face::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,transparent 20%,#ffffffa8 47%,transparent 70%);transform:translateX(-120%)}
    .ticket-logo{position:relative;width:14%;aspect-ratio:1;margin-bottom:2%;flex-shrink:0}
    .ticket-logo .gold-logo{inset:0;background:linear-gradient(130deg,#59401b,#b0812e 37%,#74511c 55%,#ba923e);filter:drop-shadow(.5px .7px 0 #f9f5e7)}
    .ticket-kicker{margin:0;font-size:2.4cqw;font-weight:600;letter-spacing:.32em;color:#775b2b}
    .ticket h2{margin:2% 0 0;font-family:Georgia,'Times New Roman',serif;font-size:10.3cqw;line-height:1.03;font-weight:400;letter-spacing:.005em;color:#896125;text-shadow:0 1px 0 #fff8}
    .ticket-year{font-family:Georgia,'Times New Roman',serif;font-size:9.3cqw;line-height:1.1;letter-spacing:.09em;margin:2% 0;color:#896125;text-shadow:0 1px 0 #fff8}
    .ornament{width:65%;height:10px;display:flex;align-items:center;gap:10px;margin:3% 0 4%;color:#8b6527}
    .ornament::before,.ornament::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#9c7838)}
    .ornament::after{transform:scaleX(-1)}
    .ornament span{display:block;width:6px;height:6px;transform:rotate(45deg);background:#997132}
    .ticket-place-label{font-size:2.5cqw;letter-spacing:.24em;margin:0 0 2%;font-weight:600;color:#785a27}
    .ticket-place{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:6.5cqw;line-height:1.12;margin:0;color:#78511c}
    .ticket-town{font-size:3.55cqw;letter-spacing:.025em;margin:3% 0 0;color:#725321}
    .ticket-age{margin:auto 0 0;padding:3.8% 0 0;border-top:1px solid #a28b5a88;width:100%;font-size:3.05cqw;font-weight:600;line-height:1.4;letter-spacing:.025em;color:#725221}
    .corner{position:absolute;width:7%;height:7%;border-color:#91692c;border-style:solid;pointer-events:none}
    .corner.a{left:5%;top:5%;border-width:1px 0 0 1px}.corner.b{right:5%;top:5%;border-width:1px 1px 0 0}.corner.c{left:5%;bottom:5%;border-width:0 0 1px 1px}.corner.d{right:5%;bottom:5%;border-width:0 1px 1px 0}
    .hint{position:absolute;left:50%;top:calc(100% + 35px);width:110%;transform:translateX(-50%);text-align:center;transition:opacity .25s;line-height:1.6;letter-spacing:.04em;font-size:14px;color:#d8c291;margin:0}
    .hint::before{content:"";display:block;margin:0 auto 12px;width:1px;height:20px;background:linear-gradient(transparent,#bc9551)}
    .status{min-height:20px;font-size:12px;letter-spacing:.13em;margin:0;color:#bcae92;text-align:center;line-height:1.6;opacity:0;transition:opacity .5s}
    .close-button{margin-top:14px;border:1px solid #74613c;border-radius:30px;background:#13110f;color:#d3bd8c;padding:12px 24px;font-size:12px;letter-spacing:.04em;cursor:pointer;visibility:hidden;opacity:0;transition:opacity .4s,background .3s}
    .close-button:hover{background:#272014}
    .footer{margin:32px 0 0;letter-spacing:.24em;font-size:9px;color:#72664e}
    .sr-only{position:absolute;width:1px;height:1px;margin:-1px;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap}
    .scene.is-open .open-trigger{opacity:0;visibility:hidden;pointer-events:none}
    .scene.is-open .seal{transform:translate(-50%,-64%) rotate(-13deg) scale(1.04)}
    .scene.is-open .flap{transform:rotateX(178deg)}
    .scene.is-open .envelope{transform:translateY(40%) scale(.9);opacity:.32}
    .scene.is-open .ticket{visibility:visible;opacity:1;clip-path:inset(0);transform:translateY(-17%) scale(1)}
    .scene.is-presented .ticket{z-index:9}
    .scene.is-presented .ticket-face::after{animation:glint 1.6s ease-out both}
    .scene.is-open .hint{opacity:0}
    .scene.is-open::after{transform:translateY(45px);opacity:.45}
    .is-revealed .status,.is-revealed .close-button{opacity:1;visibility:visible}
    @keyframes glint{to{transform:translateX(120%)}}
    @media(min-width:700px){main{padding-top:42px}.scene{margin-top:98px;margin-bottom:126px}}
    @media(max-width:359px){main{padding:30px 12px 28px}.eyebrow{font-size:9px}.intro{font-size:12px}.scene{margin-top:78px;margin-bottom:90px}.hint{font-size:12px}.year{font-size:21px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.scene.is-open .flap{transform:rotateX(178deg)}}
  </style>
</head>
<body>
  <main id="invitation">
    <header>
      <p class="eyebrow">TOP EVENTOS · NOCHEVIEJA</p>
      <span class="spark" aria-hidden="true"></span>
      <h1>COTILLÓN</h1>
      <p class="year">26 / 27</p>
      <p class="intro">Tu invitación empieza aquí.</p>
    </header>
    <div class="scene" id="scene">
      <div class="envelope" aria-hidden="true">
        <div class="paper"></div><div class="inner"></div>
        <div class="fold fold-left"></div><div class="fold fold-right"></div><div class="fold fold-bottom"></div>
        <svg class="fold-lines" viewBox="0 0 400 400" fill="none"><path d="M1 399 200 188 399 399" stroke="#00000080" stroke-width="2"/><path d="M1 398 200 187 399 398" stroke="#d4d2bc26" stroke-width=".65"/><path d="m1 1 163 164m235-164L235 165" stroke="#b8b5a418" stroke-width=".6"/></svg>
        <div class="flap"><svg viewBox="0 0 400 220" fill="none"><path d="M0 0 200 219 400 0" stroke="#0000007a" stroke-width="1.8"/><path d="M0 0 200 218 400 0" stroke="#d6d1bd38" stroke-width=".6"/></svg></div>
      </div>
      <article class="ticket" id="ticket" aria-labelledby="ticket-title" aria-hidden="true" inert>
        <div class="ticket-face">
          <span class="corner a"></span><span class="corner b"></span><span class="corner c"></span><span class="corner d"></span>
          <div class="ticket-logo" role="img" aria-label="TOP EVENTOS"><span class="gold-logo"></span></div>
          <p class="ticket-kicker">NOCHEVIEJA · ENTRADA</p>
          <h2 id="ticket-title">COTILLÓN</h2>
          <p class="ticket-year">26 / 27</p>
          <div class="ornament" aria-hidden="true"><span></span></div>
          <p class="ticket-place-label">LUGAR</p>
          <p class="ticket-place">Salón Benalucar</p>
          <p class="ticket-town">Sanlúcar la Mayor</p>
          <p class="ticket-age">Entrada para mayores de 18 años</p>
        </div>
      </article>
      <button class="open-trigger" id="open-button" type="button" aria-controls="ticket" aria-expanded="false" aria-label="Abrir el sobre y descubrir la entrada al Cotillón 26/27">
        <span class="seal" aria-hidden="true"><img class="seal-image" src="sello-cera.webp" width="960" height="960" alt="" decoding="sync" fetchpriority="high" draggable="false"></span>
      </button>
      <p class="hint" id="hint">Pulsa el sello para descubrir tu entrada</p>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button class="close-button" id="close-button" type="button" disabled>Volver a cerrar el sobre</button>
    <p class="footer">TOP EVENTOS · COTILLÓN 26/27</p>
  </main>
  <script>
    (() => {
      const scene = document.getElementById('scene');
      const main = document.getElementById('invitation');
      const openButton = document.getElementById('open-button');
      const closeButton = document.getElementById('close-button');
      const ticket = document.getElementById('ticket');
      const status = document.getElementById('status');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let state = 'closed';
      let revealTimer;
      let resetTimer;

      function openEnvelope() {
        if (state !== 'closed') return;
        state = 'opening';
        openButton.disabled = true;
        openButton.setAttribute('aria-expanded', 'true');
        scene.classList.add('is-open');
        document.getElementById('hint').setAttribute('aria-hidden', 'true');
        revealTimer = setTimeout(() => {
          state = 'open';
          scene.classList.add('is-presented');
          ticket.removeAttribute('inert');
          ticket.setAttribute('aria-hidden', 'false');
          status.textContent = 'Tu entrada al Cotillón 26/27';
          main.classList.add('is-revealed');
          closeButton.disabled = false;
          closeButton.focus({preventScroll: true});
        }, reducedMotion.matches ? 0 : 2850);
      }

      function closeEnvelope() {
        if (state !== 'open') return;
        state = 'closing';
        clearTimeout(revealTimer);
        closeButton.disabled = true;
        main.classList.remove('is-revealed');
        scene.classList.remove('is-presented', 'is-open');
        ticket.setAttribute('inert', '');
        ticket.setAttribute('aria-hidden', 'true');
        status.textContent = '';
        resetTimer = setTimeout(() => {
          state = 'closed';
          openButton.disabled = false;
          openButton.setAttribute('aria-expanded', 'false');
          document.getElementById('hint').removeAttribute('aria-hidden');
          openButton.focus({preventScroll: true});
        }, reducedMotion.matches ? 0 : 2850);
      }

      openButton.addEventListener('click', openEnvelope);
      closeButton.addEventListener('click', closeEnvelope);
    })();
  </script>
</body>
</html>
